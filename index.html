@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600&display=swap');

:root{
  --paper:#f6f2e9;
  --paper2:#fbfaf6;
  --ink:#2a2c29;
  --muted:#777a74;
  --green:#314438;
  --red:#9e463f;
  --line:rgba(40,45,40,.15);
  --shadow:0 12px 35px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#dedbd4;color:var(--ink);font-family:"Noto Sans KR",sans-serif}
.page{width:min(100%,480px);margin:auto;background:var(--paper2);overflow:hidden;box-shadow:var(--shadow)}
img{display:block;max-width:100%}
button,a{font:inherit}
.kicker{font-size:10px;letter-spacing:.22em;color:var(--muted)}
.title{font-family:"Gowun Batang",serif;font-weight:700;font-size:28px;letter-spacing:.02em;margin:10px 0 24px}
.copy{font-family:"Gowun Batang",serif;font-size:14px;line-height:2;color:#555a54}
.fade{opacity:0;transform:translateY(20px);transition:.75s ease}
.fade.show{opacity:1;transform:none}

/* COVER */
.cover{background:var(--paper2);display:block}
.poster{position:relative;width:100%;overflow:hidden;background:var(--paper2)}
.poster>img{
  width:100%;
  height:auto;
  display:block;
  object-fit:contain;
  filter:brightness(1.18) saturate(1.02) contrast(.98)
}
.poster:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.015) 58%,rgba(0,0,0,.05));
  pointer-events:none
}
.poster-copy{
  position:absolute;
  z-index:2;
  left:24px;
  right:24px;
  top:54px;
  color:#fff;
  text-align:center;
  /* No rectangular overlay: contrast comes only from a soft shadow hugging the letters. */
  background:transparent;
  padding:0;
  border:0;
  border-radius:0;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  text-shadow:
    0 1px 2px rgba(0,0,0,.95),
    0 2px 6px rgba(0,0,0,.82),
    0 0 12px rgba(0,0,0,.52)
}
.poster-copy .mini{font-size:12px;letter-spacing:.25em;margin-bottom:14px;opacity:1}
.poster-copy h1{font-family:"Gowun Batang",serif;font-size:32px;line-height:1.32;margin:0 0 15px;font-weight:700;letter-spacing:.025em}
.poster-copy .names-top{font-family:"Gowun Batang",serif;font-size:16px;line-height:1.78;letter-spacing:.045em;font-weight:700}
.music-btn{position:absolute;z-index:4;right:18px;top:18px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.62);background:rgba(18,18,18,.34);backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.music-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7}
.music-btn.playing{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.12)}50%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
.cover-open{display:none}

/* INVITATION */
.section{padding:82px 28px}
.invitation{text-align:center}
.invitation .parents{font-size:12px;line-height:2.05;color:#62665f;margin-top:34px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin-top:36px;background:rgba(255,255,255,.46)}
.quick div{padding:20px 8px;border-right:1px solid var(--line);font-size:11px;line-height:1.7}
.quick div:last-child{border-right:none}
.quick .icon{font-size:10px;letter-spacing:.13em;color:var(--red);margin-bottom:8px;font-weight:600}
.quick strong{display:block;font-weight:500;font-size:12px;margin-bottom:3px}

/* PHOTO EDITORIAL — consolidated to avoid cascade conflicts */
.moments{padding:82px 0 50px}
.moments-head{text-align:center;padding:0 28px 42px}
.magazine{display:flex;flex-direction:column;gap:56px;padding:0 18px 8px}

.hero-shot{width:82%;align-self:flex-start}
.hero-shot.right{align-self:flex-end}
.hero-shot.center{width:90%;align-self:center}
.hero-shot img{width:100%;height:auto;border:7px solid #f8f4eb;box-shadow:0 9px 24px rgba(54,46,37,.07)}

.mag-spread{position:relative;min-height:500px}
.mag-spread img{position:absolute;object-fit:cover;box-shadow:none;border:7px solid #f7f3ea;background:#f7f3ea}
.mag-spread .a{left:0;top:0;width:59%;height:66%}
.mag-spread .b{right:0;top:12%;width:36%;height:38%}
.mag-spread .c{left:7%;bottom:3%;width:35%;height:29%}
.mag-spread .d{right:5%;bottom:0;width:49%;height:39%;z-index:3}
.mag-note{position:absolute;font-family:"Gowun Batang",serif;font-size:12px;line-height:1.7;color:#6f736c;letter-spacing:.04em}
.mag-note.top{right:0;top:2px;width:36%;text-align:right;font-size:11px;letter-spacing:.08em}
.mag-note.top:before{content:"OUR MOMENTS — 01";display:block;font-family:Georgia,"Times New Roman",serif;font-size:8px;letter-spacing:.22em;color:#9a8d7c;margin-bottom:10px}

.feature-pair{position:relative;display:grid;grid-template-columns:1.25fr .75fr;gap:18px;align-items:start;padding:18px 4px 12px;border-top:1px solid #cfc7ba;border-bottom:1px solid #cfc7ba}
.feature-pair img{width:100%;object-fit:cover;border:6px solid #f8f4eb;box-shadow:0 8px 20px rgba(62,51,39,.07)}
.feature-pair img:first-child{aspect-ratio:.86/1}
.feature-pair img:last-child{aspect-ratio:.72/1;margin-top:58px}
